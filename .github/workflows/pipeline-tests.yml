# Runs lint + tests on every push and pull request to master,
# then builds and pushes the edge Docker images (master pushes only)

name: Pipeline Tests (ALL)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# One run at a time per PR / branch: a new push cancels the running PR run,
# while master runs are queued instead of cancelled, so an older run can never
# push its edge image after a newer one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    # flake8 parses code with the running Python, so it must match the images'
    - name: Read Python version from Dockerfile 🔎
      id: pyver
      run: |
        echo "version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' api/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.pyver.outputs.version }} 🐍
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.pyver.outputs.version }}
        cache: pip
        cache-dependency-path: lint/requirements.txt

    - name: Install requirements ⏬
      run: pip install -r lint/requirements.txt

    - name: Lint with flake8 📝
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics


  mongo-pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    needs:
    - lint

    services:
      # Start MongoDB 🌱
      mongo:
        # Keep in sync with production MongoDB version
        image: mongo:7.0.43
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USER || 'singouins' }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASS || 'ci-throwaway-pass' }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Read Python version from Dockerfile 🔎
      id: pyver
      run: |
        echo "version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' api/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.pyver.outputs.version }} 🐍
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.pyver.outputs.version }}
        cache: pip
        cache-dependency-path: mongo/requirements*.txt

    - name: Install requirements ⏬
      run: |
        echo "--- Installing PIP"
        python -m pip install --upgrade pip
        echo "--- Installing requirements"
        if [ -f mongo/requirements.txt ]; \
          then pip install -r mongo/requirements.txt; \
        fi
        echo "--- Installing test-only requirements"
        pip install -r mongo/requirements-tests.txt

    - name: Test with PyTest ⚙️
      env:
          LOGURU_LEVEL: ${{ vars.LOGURU_LEVEL || 'INFO' }}

          MONGO_HOST: ${{ vars.MONGO_HOST || '127.0.0.1' }}
          MONGO_USER: ${{ vars.MONGO_USER || 'singouins' }}
          MONGO_PASS: ${{ secrets.MONGO_PASS || 'ci-throwaway-pass' }}
      run: |
        echo "--- Loading maps and metas (a Kubernetes Job in production)"
        python3 -m mongo.init
        echo "--- Starting PyTest"
        pytest mongo


  app-pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      # Run every app's tests even if one fails
      fail-fast: false
      matrix:
        python-app: [ "ai", "ws", "api", "auth", "discord" ]

    needs:
    - mongo-pytest

    services:
      # Start Redis 🛢️
      redis:
        # Keep in sync with production Redis version
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Start MongoDB 🌱
      mongo:
        # Keep in sync with production MongoDB version
        image: mongo:7.0.43
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USER || 'singouins' }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASS || 'ci-throwaway-pass' }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Start Mailpit 📫
      # Fake SMTP server: catches auth's mails, readable through its HTTP API
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1465:1025   # SMTP, implicit TLS like production
          - 8025:8025   # HTTP API, used by auth/tests/test_02_mail.py
        env:
          MP_SMTP_TLS_CERT: sans:localhost   # self-signed cert, generated at start
          MP_SMTP_TLS_KEY: sans:localhost
          MP_SMTP_REQUIRE_TLS: true
          MP_SMTP_AUTH_ACCEPT_ANY: true

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Read Python version from Dockerfile 🔎
      id: pyver
      run: |
        echo "version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' ${{ matrix.python-app }}/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.pyver.outputs.version }} 🐍
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.pyver.outputs.version }}
        cache: pip
        cache-dependency-path: ${{ matrix.python-app }}/requirements*.txt

    - name: Install requirements ⏬
      run: |
        echo "--- Installing PIP"
        python -m pip install --upgrade pip
        echo "--- Installing requirements"
        if [ -f ${{ matrix.python-app }}/requirements.txt ]; \
          then pip install -r ${{ matrix.python-app }}/requirements.txt; \
        fi
        echo "--- Installing test-only requirements"
        if [ -f ${{ matrix.python-app }}/requirements-tests.txt ]; \
          then pip install -r ${{ matrix.python-app }}/requirements-tests.txt; \
        fi

    - name: Test with PyTest ⚙️
      env:
          LOGURU_LEVEL: ${{ vars.LOGURU_LEVEL || 'INFO' }}
          GUNICORN_CHDIR: ${{ vars.GUNICORN_CHDIR || github.workspace }}

          SEP_SECRET_KEY: ${{ secrets.SEP_SECRET_KEY || 'ci-throwaway-jwt-key' }}
          API_ENV: ${{ vars.API_ENV || 'CI' }}
          # Plain test-only token for api/tests/test_15_internal_eject.py; production uses a Secret
          SEP_INTERNAL_TOKEN: ci-internal-token

          MONGO_HOST: ${{ vars.MONGO_HOST || '127.0.0.1' }}
          MONGO_USER: ${{ vars.MONGO_USER || 'singouins' }}
          MONGO_PASS: ${{ secrets.MONGO_PASS || 'ci-throwaway-pass' }}

          # CI must never send real mails: auth's SMTP points to the Mailpit
          # service, which catches them (any credentials are accepted)
          SEP_SMTP_FROM: ci@example.net
          SEP_SMTP_SERVER: 127.0.0.1:1465
          SEP_SMTP_USER: ci
          SEP_SMTP_PASS: ci
          SEP_SMTP_HOSTNAME: localhost
          MAILPIT_URL: http://127.0.0.1:8025
      run: |
        echo "--- Moving mongo lib where it belongs"
        cp -a mongo ${{ matrix.python-app }}/
        # The apps don't load maps/metas themselves (a Kubernetes Job does in
        # production); ws doesn't use Mongo, nor has mongoengine installed
        if [ "${{ matrix.python-app }}" != "ws" ]; then
          echo "--- Loading maps and metas"
          python3 -m mongo.init
        fi
        # discord's tests call the bot commands in-process (Discord is mocked),
        # so there's no app to start - and main.py would try to log into Discord
        if [ "${{ matrix.python-app }}" != "discord" ]; then
          echo "--- Starting app in background"
          python3 ${{ matrix.python-app }}/main.py &
        fi
        # /auth/* moved out of api into its own service - api's own suite
        # still needs a live login (see api/tests/conftest.py's jwt_header
        # fixture, which registers/logs in against AUTH_API_URL), so start
        # auth here too, in its own venv (its requirements.txt is compiled
        # independently from api's and can drift on shared transitive
        # deps - same as they would in their own separate containers).
        if [ "${{ matrix.python-app }}" = "api" ]; then
          echo "--- Also starting auth (api's tests need a live login) ---"
          cp -a mongo auth/
          python3 -m venv /tmp/venv-auth
          /tmp/venv-auth/bin/pip install -q -r auth/requirements.txt
          GUNICORN_PORT=5001 /tmp/venv-auth/bin/python3 auth/main.py &
          export AUTH_API_URL=http://127.0.0.1:5001
        fi
        echo "--- Waiting for app(s) to be ready ($(date))"
        # Retries on connection refused, timeouts and 5xx, gives up after 60s
        wait_for_check() {
          curl -sf -o /dev/null --max-time 5 --retry 60 --retry-delay 1 \
            --retry-max-time 60 --retry-connrefused "$1"
        }
        case "${{ matrix.python-app }}" in
          ws)
            # ws is WebSocket-only (no /check): wait for its port to accept connections
            timeout 60 bash -c 'until (: > /dev/tcp/127.0.0.1/5000) 2>/dev/null; do sleep 1; done'
            ;;
          discord)
            # Nothing started, nothing to wait for
            ;;
          *)
            wait_for_check http://127.0.0.1:5000/check
            ;;
        esac
        if [ "${{ matrix.python-app }}" = "api" ]; then
          wait_for_check "$AUTH_API_URL/check"
        fi
        echo "--- Starting PyTest ($(date))"
        pytest ${{ matrix.python-app }}/tests/

  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      matrix:
        python-app: [ "ai", "ws", "api", "discord", "auth" ]

    needs:
    - app-pytest

    # Only push images on master pushes, never on pull requests
    if: github.event_name == 'push'

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Log in to Docker Hub 🔐
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_USERNAME }}/${{ matrix.python-app }}
        tags: |
          type=sha,prefix=,suffix=,format=short
          type=edge

    - name: Set up Docker Buildx 🧰
      uses: docker/setup-buildx-action@v4

    - name: Build 🏗️ & Push to Docker Hub 🚀
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./${{ matrix.python-app }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_VERSION=${{ steps.meta.outputs.version }}
          GIT_COMMIT=${{ github.sha }}
        # One cache per app, so matrix jobs don't overwrite each other
        cache-from: type=gha,scope=${{ matrix.python-app }}
        cache-to: type=gha,mode=max,scope=${{ matrix.python-app }}
