  /mypc/{pcid}/action/reload/{weaponid}:
    post:
      tags:
        - '/mypc/{pcid}/action: Standard Requests'
      summary: Reload a Weapon
      security:
        - access_token: []
      parameters:
        - in: path
          name: pcid
          schema:
            type: integer
            example: 1
          required: true
        - in: path
